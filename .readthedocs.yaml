# Read the Docs configuration file for the GECKO documentation
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Pull in the GECKO (MATLAB) and geckopy (Python) sources tracked as
# git submodules, so their docstrings can be auto-documented.
submodules:
  include: all
  recursive: true

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: requirements-sphinx.txt
