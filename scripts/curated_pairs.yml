# Hand-curated half of the MATLAB <-> Python function mapping.
#
# gen_api_pages_sphinx.py pairs functions automatically when the two names
# normalise to the same string (loadEcModel <-> load_ec_model). That only
# catches the mechanical cases: geckopy renamed part of the API, so some real
# counterparts do not match by name and have to be recorded here.
#
# Every name below is checked against the collected sources at build time. A
# MATLAB name that no longer exists on the tracked branch, or a Python name
# that is not defined in the package, fails the build, so this file cannot
# rot quietly.
#
# Three kinds of entry:
#   aliases    -- a genuine counterpart under a different name
#   cobrapy    -- no geckopy function because cobrapy already covers it
#   not_ported -- deliberately absent from Python, with the reason

aliases:
  adapterTemplate: generate_template_toml
  assignKcatValues: apply_kcat_list
  constrainFluxData: apply_flux_data_constraints
  getECfromDatabase: fill_eccodes_from_database
  getECfromGEM: fill_eccodes_from_gem
  getKcatAcrossIsozymes: fill_kcats_from_isozymes
  getStandardKcat: assign_standard_kcat
  ModelAdapterManager: resolve_adapter
  sigmaFitter: fit_sigma

# GECKO's own MATLAB functions all have a geckopy counterpart, curated or
# auto-matched; none of them hand off to cobrapy directly (RAVEN functions
# such as setParam/solveLP that geckopy delegates to cobrapy are RAVEN's, not
# GECKO's own, so they belong in raven-docs' table, not this one).
cobrapy: {}

not_ported:
  plotEcFVA: >-
    Plots an ecFVA flux range directly from the result; geckopy returns the
    ec_fva DataFrame and leaves plotting to matplotlib or seaborn directly.
  readOpenKineticsPredictorOutput: >-
    Parses a downloaded OpenKineticsPredictor result file. geckopy replaced
    the file round-trip with a REST client (submit_open_kinetics_predictor /
    fetch_open_kinetics_predictor); the equivalent parsing is internal to
    that client.
  updateProtPool: >-
    Obsolete since GECKO 3.2.0; setProtPoolSize (geckopy set_prot_pool_size)
    supersedes it.
  writeOpenKineticsPredictorInput: >-
    Builds an OpenKineticsPredictor request file. geckopy replaced the file
    round-trip with a REST client; the equivalent request-building is
    internal to that client.
